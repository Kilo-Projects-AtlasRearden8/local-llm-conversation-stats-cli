[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "local-llm-conversation-stats-cli"
version = "1.0.0"
description = "Local-first CLI to analyze local LLM chat logs: message counts, token estimates, top topics, and daily activity summaries."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [{name = "Asdale Dynamics, LLC", email = "dylan@dylanasdale.github.io"}]
keywords = ["llm", "chat", "logs", "cli", "local-ai", "local-first"]

[project.scripts]
chat-stats = "chat_stats:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["chat_stats*"]

[tool.setuptools.package-data]
"" = ["LICENSE", "README.md"]
